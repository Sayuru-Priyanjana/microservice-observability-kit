# Tempo (monolithic), traces on a persistent volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tempo
  labels:
    app: tempo
spec:
  serviceName: tempo
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tempo
          image: @@IMAGE_TEMPO@@
          args: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - { name: http, containerPort: 3200 }
            - { name: otlp-grpc, containerPort: 4317 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: @@TEMPO_MEMORY_REQUEST@@ }
            limits: { cpu: "1", memory: @@TEMPO_MEMORY_LIMIT@@ }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true
            - name: data
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: tempo-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
#@if storage-class
        storageClassName: @@STORAGE_CLASS@@
#@endif
        resources:
          requests:
            storage: @@TEMPO_VOLUME@@
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  labels:
    app: tempo
spec:
  selector:
    app: tempo
  ports:
    - { name: http, port: 3200, targetPort: http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
