# Prometheus of the observability kit (stack @@STACK_NAME@@, target @@TARGET@@). Generated by render.sh.
# Job names (otel-collector, otelcol, tempo, node-exporter) and the service_name / instance labels
# are what the dashboards query, so keep them.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: @@ENVIRONMENT@@

rule_files:
  - /etc/prometheus/rules/*.yml

# No Alertmanager: alerts are visible in Prometheus /alerts and in Grafana.

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["@@PROMETHEUS_HOST@@:9090"]
        labels: { instance: prometheus }

  # Application metrics (OTel agents -> gateway collector).
  - job_name: otel-collector
    static_configs:
      - targets: ["@@GATEWAY_HOST@@:8889"]
        labels: { instance: otel-collector }
    metric_relabel_configs:
      # host.name resource attribute -> instance (node / host / container name)
      - source_labels: [host_name]
        regex: (.+)
        target_label: instance

  # The gateway collector's own health (dropped / refused data).
  - job_name: otelcol
    static_configs:
      - targets: ["@@GATEWAY_HOST@@:8888"]
        labels: { instance: otel-collector }

  # Tempo's own metrics. traces_spanmetrics_* / traces_service_graph_* are not scraped:
  # Tempo's metrics-generator pushes them here via remote write (with exemplars).
  - job_name: tempo
    static_configs:
      - targets: ["@@TEMPO_HOST@@:3200"]
        labels: { instance: tempo }

#@if infra-federate
  # Kubernetes metrics (cAdvisor, kube-state-metrics, node-exporter) read from the cluster's existing
  # Prometheus via /federate (read-only; nothing is changed there). honor_labels keeps the original
  # job / namespace / pod / node labels.
  - job_name: federate
    scrape_interval: 30s
    scrape_timeout: 25s
    honor_labels: true
    metrics_path: /federate
    params:
      "match[]":
        # pods of this stack
        - '{__name__=~"container_cpu_usage_seconds_total|container_memory_working_set_bytes", namespace="@@STACK_NAME@@"}'
        - '{__name__=~"kube_deployment_status_replicas_ready|kube_deployment_spec_replicas|kube_pod_container_status_restarts_total|kube_pod_info", namespace="@@STACK_NAME@@"}'
        # @@FEDERATE_APPS@@
        # nodes
        - '{job="node-exporter"}'
    static_configs:
      - targets: ["@@FEDERATE_FROM@@"]
#@endif
#@if infra-cadvisor
  # Container metrics (cAdvisor) and host metrics (node-exporter) of the Docker host.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels: { instance: "@@HOST_LABEL@@" }
    metric_relabel_configs:
      # keep only real containers (cAdvisor also reports cgroups without a name)
      - source_labels: [name]
        regex: (.+)
        action: keep
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: { instance: "@@HOST_LABEL@@" }
#@endif
#@if infra-nomad
  # Everything registered in Nomad's service catalog with the tag "metrics" (the kit's infra job
  # registers node-exporter and cadvisor on every client). Job name = Nomad service name.
  - job_name: nomad-services
    nomad_sd_configs:
      - server: '@@NOMAD_ADDR@@'
        namespace: "*"
    relabel_configs:
      - source_labels: [__meta_nomad_tags]
        regex: .*,metrics,.*
        action: keep
      - source_labels: [__meta_nomad_service]
        target_label: job
      - source_labels: [__meta_nomad_node_id]
        target_label: nomad_node_id
      - source_labels: [__meta_nomad_address]
        target_label: instance
    metric_relabel_configs:
      - source_labels: [job, name]
        regex: cadvisor;
        action: drop
#@endif
#@if infra-node
  # Host metrics of this machine (node-exporter installed next to the stack).
  - job_name: node-exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels: { instance: "@@HOST_LABEL@@" }
#@endif
  # @@EXTRA_SCRAPE@@
