# Observability stack @@STACK_NAME@@ (Docker Compose). Generated by render.sh.
#   docker compose up -d          (in this folder; .env holds the Grafana admin password)
# Exposure:
#   OTLP gRPC / HTTP  @@BIND_ADDRESS@@:4317 / 4318   apps send here (firewall: app hosts only)
#   Grafana           @@BIND_ADDRESS@@:@@GRAFANA_PORT@@
#   Prometheus, Tempo @@ADMIN_BIND_ADDRESS@@:9090 / 3200
# Apps on this Docker host can join the network "@@STACK_NAME@@" and use http://otel-collector:4317.
name: @@STACK_NAME@@

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  default:
    name: @@STACK_NAME@@

services:
  otel-collector:
    image: @@IMAGE_OTEL_COLLECTOR@@
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./config/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "@@BIND_ADDRESS@@:4317:4317"
      - "@@BIND_ADDRESS@@:4318:4318"
      # 8888 (own metrics), 8889 (app metrics for Prometheus), 13133 (health) stay on the network.
    mem_limit: @@GATEWAY_MEMORY_LIMIT_COMPOSE@@
    logging: *logging
    restart: unless-stopped

  prometheus:
    image: @@IMAGE_PROMETHEUS@@
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=@@PROMETHEUS_RETENTION_TIME@@
      - --storage.tsdb.retention.size=@@PROMETHEUS_RETENTION_SIZE@@
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "@@ADMIN_BIND_ADDRESS@@:9090:9090"
    mem_limit: @@PROMETHEUS_MEMORY_LIMIT_COMPOSE@@
    logging: *logging
    restart: unless-stopped

  tempo:
    image: @@IMAGE_TEMPO@@
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    # Tempo runs as uid 10001; the named volume is created with the image's ownership.
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "@@ADMIN_BIND_ADDRESS@@:3200:3200"   # OTLP 4317 stays on the network: only the collector sends
    depends_on: [prometheus]
    mem_limit: @@TEMPO_MEMORY_LIMIT_COMPOSE@@
    logging: *logging
    restart: unless-stopped
#@if grafana-bundled

  grafana:
    image: @@IMAGE_GRAFANA@@
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Only used when Grafana creates its database (first start). Change it later in the UI.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_LOG_MODE: console
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "@@BIND_ADDRESS@@:@@GRAFANA_PORT@@:3000"
    depends_on: [prometheus, tempo]
    mem_limit: @@GRAFANA_MEMORY_LIMIT_COMPOSE@@
    logging: *logging
    restart: unless-stopped
#@endif
#@if infra-cadvisor

  # Container metrics of this Docker host.
  cadvisor:
    image: @@IMAGE_CADVISOR@@
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --disable_metrics=advtcp,cpu_topology,disk,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    mem_limit: 256m
    logging: *logging
    restart: unless-stopped

  # Host metrics (CPU, memory, disks, network) of this Docker host.
  node-exporter:
    image: @@IMAGE_NODE_EXPORTER@@
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
    pid: host
    mem_limit: 128m
    logging: *logging
    restart: unless-stopped
#@endif

volumes:
  prometheus-data:
  tempo-data:
#@if grafana-bundled
  grafana-data:
#@endif
