# Grafana dashboard provider (bundled Grafana): one sub-folder per app under /var/lib/grafana/dashboards
# becomes one Grafana folder. Generated by render.sh.
apiVersion: 1
providers:
  - name: observability-kit
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
