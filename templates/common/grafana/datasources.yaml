# Grafana datasources of the observability kit (stack @@STACK_NAME@@). Generated by render.sh.
# The uids obs-prometheus / obs-tempo are what every kit dashboard uses: keep them.
# In provisioning files `$` starts an env-var reference, so Grafana variables are written `$$`.
apiVersion: 1
datasources:
  - name: Prometheus (@@STACK_NAME@@)
    type: prometheus
    uid: obs-prometheus
    url: @@PROMETHEUS_URL_FOR_GRAFANA@@
    access: proxy
    editable: false
    jsonData:
      timeInterval: 15s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: obs-tempo
        - name: traceID
          datasourceUid: obs-tempo
  - name: Tempo (@@STACK_NAME@@)
    type: tempo
    uid: obs-tempo
    url: @@TEMPO_URL_FOR_GRAFANA@@
    access: proxy
    editable: false
    jsonData:
      serviceMap:
        datasourceUid: obs-prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      streamingEnabled:
        search: true
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: "-30m"
        spanEndTimeShift: "30m"
      tracesToMetrics:
        datasourceUid: obs-prometheus
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags:
          - key: service.name
            value: service
        queries:
          - name: Request rate (span)
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags, span_name="$${__span.name}"}[1m]))'
          - name: Error rate (span)
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags, span_name="$${__span.name}", status_code="STATUS_CODE_ERROR"}[1m]))'
          - name: p95 latency (span)
            query: 'histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{$$__tags, span_name="$${__span.name}"}[1m])))'
