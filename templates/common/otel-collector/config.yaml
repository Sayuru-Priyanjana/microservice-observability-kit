# OpenTelemetry Collector (gateway) of the observability kit. Generated by render.sh.
#   apps --OTLP :4317 (gRPC) / :4318 (HTTP)--> this gateway
#     metrics -> Prometheus exporter :8889 (scraped by the kit's Prometheus)
#     traces  -> drop health checks -> scrub personal data -> Tempo
# Lines between "#@if <tag>" and "#@endif" are kept only for matching targets/options.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: @@OTLP_LISTEN_ADDRESS@@:4317
      http:
        endpoint: @@OTLP_LISTEN_ADDRESS@@:4318

processors:
  # Percentages of the memory available to the collector (container / task limit).
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}

#@if kubernetes
  # Pod metadata from the Kubernetes API (needs the ClusterRole in rbac.yaml). Pods are matched by
  # the k8s.pod.name / k8s.namespace.name the agent sends, otherwise by the connection IP.
  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    extract:
      metadata: [k8s.pod.name, k8s.namespace.name, k8s.deployment.name, k8s.node.name]
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.name
          - from: resource_attribute
            name: k8s.namespace.name
      - sources:
          - from: connection

  # host.name = node name when the app did not set it (becomes the `instance` label).
  resource/hostname:
    attributes:
      - key: host.name
        from_attribute: k8s.node.name
        action: insert
#@endif

  # Health checks are noise: drop spans from the Kubernetes kubelet probe client and spans of
  # well-known health / metrics endpoints (DROP_PATHS_REGEX in kit.env).
  filter/health:
    error_mode: ignore
    traces:
      span:
        - 'attributes["user_agent.original"] != nil and IsMatch(attributes["user_agent.original"], "^kube-probe/")'
        - 'kind == SPAN_KIND_SERVER and attributes["url.path"] != nil and IsMatch(attributes["url.path"], "@@DROP_PATHS_REGEX@@")'
        - 'kind == SPAN_KIND_SERVER and attributes["http.target"] != nil and IsMatch(attributes["http.target"], "@@DROP_PATHS_REGEX@@")'

  # Remove data that commonly holds personal data before it is stored:
  # query strings (e-mails, tokens, search terms) and client IP addresses.
  transform/scrub:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["http.target"], "\\?.*$", "")
          - replace_pattern(attributes["http.url"], "\\?.*$", "")
          - replace_pattern(attributes["url.full"], "\\?.*$", "")
          - delete_key(attributes, "url.query")
          - delete_key(attributes, "http.client_ip")
          - delete_key(attributes, "client.address")
          - delete_key(attributes, "net.sock.peer.addr")

exporters:
  prometheus:
    endpoint: @@COLLECTOR_INTERNAL_ADDRESS@@:8889
    # Resource attributes (service.name, host.name, ...) become labels (service_name, host_name, ...).
    resource_to_telemetry_conversion:
      enabled: true
    # OpenMetrics exposes exemplars (trace IDs on histogram buckets).
    enable_open_metrics: true
    # Series of a service that stopped sending disappear after this time.
    metric_expiration: 5m

  otlp_grpc/tempo:
    endpoint: @@TEMPO_OTLP_ENDPOINT@@
    tls:
      insecure: true   # plain gRPC on the stack's internal network

extensions:
  health_check:
    endpoint: @@COLLECTOR_INTERNAL_ADDRESS@@:13133

service:
  extensions: [health_check]
  telemetry:
    # The collector's own metrics (accepted / refused / failed data) on :8888.
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: @@COLLECTOR_INTERNAL_ADDRESS@@
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors:
        - memory_limiter
#@if kubernetes
        - k8sattributes
        - resource/hostname
#@endif
        - batch
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors:
        - memory_limiter
        - filter/health
#@if kubernetes
        - k8sattributes
        - resource/hostname
#@endif
        - transform/scrub
        - batch
      exporters: [otlp_grpc/tempo]
