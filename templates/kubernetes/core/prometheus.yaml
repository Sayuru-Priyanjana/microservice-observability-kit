# Prometheus for traces / app metrics, data on a persistent volume.
# Tempo remote-writes span metrics here (--web.enable-remote-write-receiver).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: @@IMAGE_PROMETHEUS@@
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=@@PROMETHEUS_RETENTION_TIME@@
            - --storage.tsdb.retention.size=@@PROMETHEUS_RETENTION_SIZE@@
            - --web.enable-lifecycle
            - --web.enable-remote-write-receiver
            - --enable-feature=exemplar-storage
          ports:
            - { name: http, containerPort: 9090 }
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: @@PROMETHEUS_MEMORY_REQUEST@@ }
            limits: { cpu: "1", memory: @@PROMETHEUS_MEMORY_LIMIT@@ }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
#@if storage-class
        storageClassName: @@STORAGE_CLASS@@
#@endif
        resources:
          requests:
            storage: @@PROMETHEUS_VOLUME@@
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - { name: http, port: 9090, targetPort: http }
