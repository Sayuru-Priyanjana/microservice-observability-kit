# OTel Java agent for deployment @@DEPLOYMENT@@ (container @@CONTAINER@@), app @@APP_NAME@@.
# Generated by render.sh. Applying it restarts the deployment's pods (rolling).
# The agent jar is copied from the agent image by an init container: the app image is unchanged.
spec:
  template:
    spec:
      initContainers:
        - name: otel-java-agent
          image: @@IMAGE_JAVA_AGENT@@
          command: ["cp", "/javaagent.jar", "/otel/javaagent.jar"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: otel-java-agent
              mountPath: /otel
          # @@INIT_OVERRIDES@@
      volumes:
        - name: otel-java-agent
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: @@CONTAINER@@
          volumeMounts:
            - name: otel-java-agent
              mountPath: /otel
              readOnly: true
          env:
            - { name: JAVA_TOOL_OPTIONS, value: "-javaagent:/otel/javaagent.jar" }
            # @@OTEL_ENV@@
          # @@CONTAINER_OVERRIDES@@
