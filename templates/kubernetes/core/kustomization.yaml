# Core of the observability stack @@STACK_NAME@@: deployed ONCE per cluster, shared by every app.
# Generated by render.sh - edit templates/ and kit.env, not this copy.
#   kubectl diff -k .   then   kubectl apply -k .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: @@STACK_NAME@@

labels:
  - pairs:
      app.kubernetes.io/part-of: @@STACK_NAME@@

resources:
  - namespace.yaml
  - rbac.yaml
  - otel-gateway.yaml
  - prometheus.yaml
  - tempo.yaml

# Config changes get a new ConfigMap name (hash suffix), which rolls the pods that use it.
configMapGenerator:
  - name: otel-gateway-config
    files:
      - config/otel-collector/config.yaml
  - name: prometheus-config
    files:
      - config/prometheus/prometheus.yml
  - name: prometheus-rules
    files:
      - config/prometheus/rules/alerts.yml
  - name: tempo-config
    files:
      - config/tempo/tempo.yaml
