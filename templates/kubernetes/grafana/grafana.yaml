# Bundled Grafana of the observability stack @@STACK_NAME@@ (GRAFANA_MODE=bundled).
# Datasources and dashboards are provisioned from ConfigMaps; the admin password comes from the
# Secret grafana-admin (generated by render.sh from secrets/grafana-admin-password).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate   # the SQLite database on the volume can only be opened by one pod
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: @@IMAGE_GRAFANA@@
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD   # only used when the database is created (first start)
              valueFrom:
                secretKeyRef: { name: grafana-admin, key: password }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            - { name: GF_SECURITY_DISABLE_GRAVATAR, value: "true" }
            - { name: GF_LOG_MODE, value: console }
#@if ingress
            - { name: GF_SERVER_ROOT_URL, value: "https://@@GRAFANA_INGRESS_HOST@@/" }
#@endif
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: @@GRAFANA_MEMORY_REQUEST@@ }
            limits: { cpu: "1", memory: @@GRAFANA_MEMORY_LIMIT@@ }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            # @@DASHBOARD_MOUNTS@@
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        # @@DASHBOARD_VOLUMES@@
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
spec:
  accessModes: ["ReadWriteOnce"]
#@if storage-class
  storageClassName: @@STORAGE_CLASS@@
#@endif
  resources:
    requests:
      storage: @@GRAFANA_VOLUME@@
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - { name: http, port: 3000, targetPort: http }
#@if ingress
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
spec:
#@if ingress-class
  ingressClassName: @@GRAFANA_INGRESS_CLASS@@
#@endif
  rules:
    - host: @@GRAFANA_INGRESS_HOST@@
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port: { name: http }
  # TLS: add a `tls:` section with a certificate Secret (or let cert-manager create one).
#@endif
