# GRAFANA_MODE=sidecar: values to ADD to the Helm release that runs the existing Grafana
# (rancher-monitoring, or kube-prometheus-stack), once per cluster. Generated by render.sh.
# Keep all existing values; only merge this `grafana` block into the existing `grafana:` key.
# Rancher UI: Apps -> Installed Apps -> cattle-monitoring-system/rancher-monitoring -> Edit/Upgrade
#   -> Edit YAML -> merge -> Upgrade (same chart version). Grafana restarts briefly.
# Helm CLI:  helm upgrade <release> <chart> -n <ns> --version <same> --reuse-values -f values-grafana.yaml
# In provisioning files `$` starts an env-var reference, so Grafana variables are written `$$`.
grafana:
  sidecar:
    dashboards:
      # dashboards land in the folder named by the ConfigMap's grafana_folder annotation
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  additionalDataSources:
    # @@DATASOURCES@@
