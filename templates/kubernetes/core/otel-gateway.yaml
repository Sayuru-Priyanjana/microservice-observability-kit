# OTel Collector gateway: apps send OTLP to otel-gateway.@@STACK_NAME@@.svc:4317.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  labels:
    app: otel-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-gateway
  template:
    metadata:
      labels:
        app: otel-gateway
    spec:
      serviceAccountName: otel-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: @@IMAGE_OTEL_COLLECTOR@@
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: prom-exporter, containerPort: 8889 }
            - { name: metrics, containerPort: 8888 }
            - { name: health, containerPort: 13133 }
          livenessProbe:
            httpGet: { path: /, port: health }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /, port: health }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: @@GATEWAY_MEMORY_REQUEST@@ }
            limits: { cpu: 500m, memory: @@GATEWAY_MEMORY_LIMIT@@ }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  labels:
    app: otel-gateway
spec:
  selector:
    app: otel-gateway
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: prom-exporter, port: 8889, targetPort: prom-exporter }
    - { name: metrics, port: 8888, targetPort: metrics }
