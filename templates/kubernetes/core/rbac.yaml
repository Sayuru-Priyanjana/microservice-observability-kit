# The gateway's k8sattributes processor reads pod / namespace / node / replicaset metadata.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: @@STACK_NAME@@-otel-gateway
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: @@STACK_NAME@@-otel-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: @@STACK_NAME@@-otel-gateway
subjects:
  - kind: ServiceAccount
    name: otel-gateway
    namespace: @@STACK_NAME@@
