# Grafana Tempo, monolithic mode (-target=all), traces on local disk. Generated by render.sh.
# Retention @@TEMPO_RETENTION@@. Span metrics and the service graph are remote-written to the kit's Prometheus.

stream_over_http_enabled: true   # streaming search results in Grafana

server:
  http_listen_port: 3200
#@if nomad|host
  # Host networking: the HTTP API only on the admin address. Tempo's internal gRPC (9095) and
  # memberlist (7946) ports stay on all interfaces (its ring uses the node's IP): firewall them.
  http_listen_address: @@ADMIN_BIND_ADDRESS@@
#@endif
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: @@TEMPO_OTLP_LISTEN@@   # only the otel-gateway sends here

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# How long traces are kept.
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: @@TEMPO_RETENTION@@
backend_worker:
  compaction:
    block_retention: @@TEMPO_RETENTION@@

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://@@PROMETHEUS_HOST@@:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs:
      # Client spans with these attributes but no matching server span become "virtual" nodes
      # (databases, caches, external APIs) in the service graph.
      peer_attributes: [peer.service, db.name, db.system]
    span_metrics:
      # Extra labels on traces_spanmetrics_*. Only add LOW-cardinality attributes (never user ids,
      # order ids, full URLs): every distinct value is a new time series in Prometheus.
      dimensions: [@@SPAN_METRICS_DIMENSIONS@@]

overrides:
  defaults:
    compaction:
      block_retention: @@TEMPO_RETENTION@@
    metrics_generator:
      processors: [service-graphs, span-metrics]
      generate_native_histograms: classic   # traces_spanmetrics_latency_bucket (+ exemplars)

usage_report:
  reporting_enabled: false
