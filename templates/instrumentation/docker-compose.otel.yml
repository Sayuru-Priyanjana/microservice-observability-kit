# Example: add the OTel Java agent to a service of app @@APP_NAME@@ running in Docker Compose.
# Generated by render.sh. Merge into the app's compose file (or pass it as an extra -f file):
#   docker compose -f docker-compose.yml -f docker-compose.otel.yml up -d
# The one-shot service "otel-agent" copies the agent jar into a volume (the app image is unchanged).
# Rename "my-service" to the app's service; repeat its block for every Java service.
services:
  otel-agent:
    image: @@IMAGE_JAVA_AGENT@@
    command: ["cp", "/javaagent.jar", "/otel/opentelemetry-javaagent.jar"]
    volumes:
      - otel-agent:/otel
    restart: "no"

  my-service:
    env_file: [otel.env]
    environment:
      OTEL_SERVICE_NAME: my-service            # must match @@SERVICE_REGEX@@
      JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar
#@if same-host
      # The stack runs on this Docker host: talk to the collector over its network.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    networks: [default, observability]
#@endif
    volumes:
      - otel-agent:/otel:ro
    depends_on:
      otel-agent:
        condition: service_completed_successfully

volumes:
  otel-agent:
#@if same-host

networks:
  observability:
    name: @@STACK_NAME@@
    external: true
#@endif
